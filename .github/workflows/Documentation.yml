name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling CausalDynamics (path source)
        run: |
          # Project.toml [sources] CausalDynamics = {path = "../CausalDynamics.jl"}
          git clone --depth 1 https://github.com/SimonAB/CausalDynamics.jl.git \
            "$GITHUB_WORKSPACE/../CausalDynamics.jl"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            # Fork GraphMakie 0.6 compat lives on cdcs-fork.
            Pkg.add(url="https://github.com/SimonAB/CausalInference.jl.git", rev="cdcs-fork")
            Pkg.add(url="https://github.com/SimonAB/DAGMakie.jl.git")
            Pkg.instantiate()'
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          CI: "true"
        run: julia --project=docs docs/make.jl
