name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          # Standalone CI: package Project.toml still uses a monorepo path source.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Project.toml")
          text = p.read_text()
          old = 'CausalDynamics = {path = "../CausalDynamics.jl"}'
          new = 'CausalDynamics = {url = "https://github.com/SimonAB/CausalDynamics.jl.git"}'
          if old not in text:
              raise SystemExit("expected path source for CausalDynamics not found")
          p.write_text(text.replace(old, new, 1))
          PY
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            # Fork GraphMakie 0.6 compat lives on cdcs-fork.
            Pkg.add(url="https://github.com/SimonAB/CausalInference.jl.git", rev="cdcs-fork")
            Pkg.add(url="https://github.com/SimonAB/DAGMakie.jl.git")
            Pkg.instantiate()'
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          CI: "true"
        run: julia --project=docs docs/make.jl
