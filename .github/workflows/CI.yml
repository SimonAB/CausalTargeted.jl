name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # MissingnessSpec / IdentificationResult.missingness live on CausalDynamics
      # main ahead of General 0.4.1; Mediation tip matches the weakdep tests.
      - name: Test with tip CausalDynamics and CausalMediation
        run: |
          julia --startup-file=no --threads=auto -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop([
              PackageSpec(url="https://github.com/SimonAB/CausalDynamics.jl.git"),
              PackageSpec(url="https://github.com/SimonAB/CausalMediation.jl.git"),
              PackageSpec(path=pwd()),
            ])
            Pkg.test("CausalTargeted"; coverage=true)
          '
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
