name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Release checks resolve CausalDynamics and CausalMediation from General.
      - name: Test with registered dependencies
        run: |
          julia --project=. --startup-file=no --threads=auto -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.test("CausalTargeted"; coverage=true)
          '
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  logistic-compatibility:
    name: Logistic - Julia ${{ matrix.version }} - RxInfer ${{ matrix.rxinfer }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1.13']
        rxinfer: ['4', '5', '6']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Test logistic extension compatibility
        env:
          RXINFER_VERSION: ${{ matrix.rxinfer }}
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project=. --startup-file=no --threads=auto -e '
            using Pkg
            root = pwd()
            Pkg.activate(temp=true)
            Pkg.develop(PackageSpec(path=root))
            Pkg.add([
              PackageSpec(name="RxInfer", version=ENV["RXINFER_VERSION"]),
              PackageSpec(name="GraphPPL"),
              PackageSpec(name="DataFrames"),
              PackageSpec(name="Distributions"),
              PackageSpec(name="FastGaussQuadrature"),
              PackageSpec(name="QuadGK"),
            ])
            Pkg.status()
            using Test, RxInfer, GraphPPL, CausalTargeted
            for file in ("test_logistic_engine.jl", "test_bayesian_logistic.jl", "test_bayesian_policy_support.jl", "test_logistic_quadrature.jl", "test_logistic_tails.jl")
              include(joinpath(root, "test", file))
            end
          '
